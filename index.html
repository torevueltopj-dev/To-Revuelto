<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TR MUN AI</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container">
    <img src="logo.png" class="logo">

    <h2>TR MUN Delegates AI</h2>

    <select id="mode">
        <option value="busqueda">1. Búsqueda Diplomática</option>
        <option value="interpelacion">2. Interpelación MUN</option>
        <option value="correccion">3. Corrección de discursos</option>
        <option value="desglose">4. Desglose de tópico</option>
        <option value="documento">5. Corrección de Position Paper</option>
    </select>

    <textarea id="input" placeholder="Escribe aquí tu discurso, pregunta o tópico..."></textarea>

    <button onclick="procesar()">Procesar</button>

    <div id="respuesta"></div>
</div>

<script src="app.js"></script>
</body>
</html>
